    <script>
        $(function () {
            // 表单提交
            $('#myForm').on('submit', function (e) {
                e.preventDefault(); //阻止浏览器默认表单刷新提交

                // 先移除旧错误
                $('#formError').remove();

                // 取值
                var fullName = $('input[name="FullName"]').val().trim();
                var mobilePhone = $('input[name="MobilePhone"]').val().trim();
                var email = $('input[name="Email"]').val().trim();
                var company = $('input[name="Company"]').val().trim();
                var province = $('input[name="Province"]').val().trim();

                var systemType = $('select[name="SystemType"]').val().trim();
                var desc = $('input[name="Desc"]').val().trim();


                // 必填校验（职位除外）
                var errors = [];

                if (!fullName) errors.push("Name is required");
                if (!mobilePhone) errors.push("Phone number is required");
                if (!email) errors.push("Email is required");
                if (!company) errors.push("Company name is required");
                if (!province) errors.push("Province is required");
                if (!systemType) errors.push("Product / solution of interest is required");
                if (!desc) errors.push("Description of the inquiry is required");

                // 有错误，阻止提交
                if (errors.length > 0) {
                    $('<div id="formError" class="form-error">' + errors.join('<br>') + '</div>')
                        .insertBefore($('#myForm'));
                    return;
                }

                var postData = {
                    "target_type": "alone",
                    "system_type": "renew",
                    "anonymous_id": "28D2B19347111FFB",
                    "fingerprint_id": "ZQ_6ad62f93VirjXpANDmWFVAQuqgzlhepFeBOfnSQZ",
                    "clientresources": {
                        "customer_id": "eac46865-c090-14fb-51b9-f522e38a3a7b",
                        "secretcode": "Rk2vp4VfavT3qSFh0H70a5ghm8Jvm5AiyF7IsNLrEzsJwVR7tRySjHG0mZLnNi4xnAiUtRPNoE7zqbYrEG2msg=="
                    },
                    "unique_id": "",
                    "org_id": "orga198c51108352ad4c9a8980813e1a7c9",
                    "FullName": fullName,
                    "MobilePhone": mobilePhone,
                    "Email": email,
                    "Company": company,
                    "Position": "",
                    "Descriptionoftheinquiry": desc,
                    "Productorsolutionofinterest": systemType,
                    "Province": province,
                    "module": "",
                    "source": { "utm": null },
                    "form_id": 14068,
                    "wechat_openid": null,
                    "wechat_appid": null,
                    "wx_id": "",
                    "wechat_fans_info": null,
                    "activity_id": ""
                }


                $.ajax({
                    url: "https://app.beschannels.com/api/cdp/form-app/commit",
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify(postData),
                    dataType: "json",
                    success: function (res) {
                        console.log("提交成功", res);
                        $('#formError').remove();
                        //$('#formMsg').removeClass('hidden');
                        //window.open("https://img02.ma.scrmtech.com/cms/orga198c51108352ad4c9a8980813e1a7c9/1789369258169/Work_Bench_System_CN.pdf", "_blank");
                        window.open("../FormSubmission-successful/", "_blank");
                    },
                    error: function (xhr) {
                        console.error("提交失败", xhr);
                    }
                });
            });

            //$('span.slidecontrols').hide();
        });
    </script>
